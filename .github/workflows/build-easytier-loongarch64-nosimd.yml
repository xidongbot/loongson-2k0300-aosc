name: Build EasyTier (loongarch64 new-world, no LSX)

# 为久久派 2K0300（Loongson LA264，无 LSX/LASX）构建 easytier-core / easytier-cli。
#
# 关键点：
#  - Rust 的 loongarch64 target 默认开 +lsx，且预编译 std 也带 LSX；必须 RUSTFLAGS=-Ctarget-feature=-lsx
#    并用 -Z build-std 连标准库一起重编。
#  - C 依赖（zstd-sys / kcp-sys / libmimalloc-sys / ring）用交叉 gcc + -mno-lsx 编译。
#  - 不用 zig：zig 自带的 musl libc / compiler_rt 在 loongarch64 默认带 LSX（实测残留 398 条），
#    且预编译无法用 CFLAGS 关闭。
#  - 在 Debian 容器里用 Debian 的 loongarch64 交叉 glibc 工具链（Ubuntu 没有交叉 libc）。
#    libc 动态链接、不进入本二进制；AOSC 的 glibc 版本更新，前向兼容。
on:
  workflow_dispatch:
    inputs:
      easytier_ref:
        description: "EasyTier git ref（tag/branch）；留空 = 最新 release"
        required: false
        default: ""
      rust_toolchain:
        description: "Rust 工具链（需与上游 rust-toolchain.toml 一致）"
        required: true
        default: "1.95"
      publish_release:
        description: "把产物发布到 Release（固定 tag），便于板子直接 curl 下载"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq xz-utils perl pkg-config unzip build-essential

      - name: Resolve EasyTier ref
        id: ref
        env:
          REF_IN: ${{ inputs.easytier_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/EasyTier/EasyTier/releases/latest | jq -r .tag_name || true)"
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::warning::无法解析最新 release（API 限流？），回退到 main"
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using EasyTier ref: $REF"

      - name: Checkout EasyTier
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: ${{ steps.ref.outputs.ref }}
          path: easytier
          submodules: recursive

      - name: Install loongarch64 cross toolchain (Debian)
        run: |
          apt-get install -y --no-install-recommends \
            gcc-loongarch64-linux-gnu g++-loongarch64-linux-gnu \
            binutils-loongarch64-linux-gnu libc6-dev-loong64-cross
          loongarch64-linux-gnu-gcc --version | head -1
          ls /usr/loongarch64-linux-gnu/lib/ | head

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: loongarch64-unknown-linux-gnu
          components: rust-src, llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: easytier

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build easytier-core/cli (rebuild std, no LSX)
        working-directory: easytier
        env:
          RUSTC_BOOTSTRAP: "1"
          RUSTFLAGS: "-Ctarget-feature=-lsx"
          CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER: "loongarch64-linux-gnu-gcc"
          CC_loongarch64_unknown_linux_gnu: "loongarch64-linux-gnu-gcc"
          CXX_loongarch64_unknown_linux_gnu: "loongarch64-linux-gnu-g++"
          AR_loongarch64_unknown_linux_gnu: "loongarch64-linux-gnu-ar"
          CFLAGS_loongarch64_unknown_linux_gnu: "-mno-lsx -mno-lasx -fno-tree-vectorize"
          CXXFLAGS_loongarch64_unknown_linux_gnu: "-mno-lsx -mno-lasx -fno-tree-vectorize"
        run: |
          cargo build --release \
            --config profile.release.strip=false \
            --target loongarch64-unknown-linux-gnu \
            -Z build-std=std,panic_abort \
            -p easytier --features mimalloc

      - name: Verify no LSX/LASX instructions
        working-directory: easytier
        run: |
          set -e
          SYSROOT="$(rustc --print sysroot)"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          OBJDUMP="$SYSROOT/lib/rustlib/$HOST/bin/llvm-objdump"
          D="target/loongarch64-unknown-linux-gnu/release"
          fail=0
          for b in easytier-core easytier-cli; do
            n="$("$OBJDUMP" -d --no-show-raw-insn "$D/$b" | grep -cE '^[[:space:]]*[0-9a-f]+:[[:space:]]+x?v' || true)"
            echo "$b: SIMD instruction lines = $n"
            [ "$n" = "0" ] || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "--- top symbols containing SIMD (easytier-core) ---"
            "$OBJDUMP" -d --no-show-raw-insn "$D/easytier-core" \
              | awk '/^[0-9a-f]+ <.*>:/{sym=$0} /^[[:space:]]*[0-9a-f]+:[[:space:]]+x?v/{print sym}' \
              | sort | uniq -c | sort -rn | head -25 || true
            echo "::error::检测到 LSX/LASX 指令，在 LA264 上会 SIGILL"
            exit 1
          fi

      - name: Package
        run: |
          set -e
          D="easytier/target/loongarch64-unknown-linux-gnu/release"
          mkdir -p out
          cp -v "$D/easytier-core" "$D/easytier-cli" out/
          SYSROOT="$(rustc --print sysroot)"; HOST="$(rustc -vV | sed -n 's/^host: //p')"
          "$SYSROOT/lib/rustlib/$HOST/bin/llvm-strip" --strip-all out/easytier-core out/easytier-cli || true
          (cd easytier && git rev-parse --short HEAD) > out/GIT_REV
          file out/easytier-core out/easytier-cli
          tar -C out -czf out/easytier-loongarch64-nosimd.tar.gz easytier-core easytier-cli GIT_REV
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-loongarch64-nosimd
          path: out/

      - name: Publish to Release (rolling tag)
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: easytier-nosimd
          name: EasyTier (loongarch64, no LSX)
          body: |
            EasyTier `${{ steps.ref.outputs.ref }}`，loongarch64 新世界、无 LSX/LASX，
            适用于 Loongson 2K0300 (LA264)；动态链接 glibc。

            由 CI run ${{ github.run_id }} 构建（commit ${{ github.sha }}）。
          files: out/easytier-loongarch64-nosimd.tar.gz
          prerelease: true
