name: Build AIC8800 SDIO driver (loongarch64)

# 交叉编译 radxa-pkg/aic8800 的 SDIO 内核模块，目标 AOSC OS 6.12.35.lsgd / loongarch64。
# 不在板子上安装 gcc（避免连带升级 glibc）。
#
# 为什么用完整上游源码：AOSC 的 kernel headers 包不含 arch/loongarch/include，
# 无法直接编译外部模块。AOSC 内核 = 上游 6.12.35 + 补丁，故用上游源码做 KDIR，
# 但沿用 AOSC 的 .config 与 Module.symvers，保证 vermagic / 符号 CRC 与运行内核一致。
on:
  workflow_dispatch:
    inputs:
      kernel_deb:
        description: "AOSC kernel package (.deb) URL providing .config + Module.symvers"
        required: true
        default: "https://repo-hk.aosc.io/debs/pool/stable/bsp-loongarch64-nosimd/l/linux-kernel-loongarch-2k0300-6.12.35_6.12.35-0_loongarch64.deb"
      kernel_tar:
        description: "Upstream kernel source tarball (must match AOSC kernel version)"
        required: true
        default: "https://mirrors.kernel.org/pub/linux/kernel/v6.x/linux-6.12.35.tar.xz"
      driver_ref:
        description: "radxa-pkg/aic8800 git ref"
        required: true
        default: "main"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install loongarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14-loongarch64-linux-gnu binutils-loongarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev patch xz-utils
          for b in gcc gcc-ar gcc-nm gcc-ranlib; do
            sudo ln -sf "/usr/bin/loongarch64-linux-gnu-${b}-14" "/usr/bin/loongarch64-linux-gnu-${b}"
          done
          loongarch64-linux-gnu-gcc --version | head -1

      - name: Fetch AOSC kernel package (authoritative .config + Module.symvers)
        run: |
          curl -fL -o /tmp/kernel.deb "${{ inputs.kernel_deb }}"
          mkdir -p kroot && dpkg-deb -x /tmp/kernel.deb kroot
          KPKG="$(pwd)/$(echo kroot/usr/src/linux-headers-*)"
          echo "KPKG=$KPKG" >> "$GITHUB_ENV"
          for f in .config Module.symvers include/config/kernel.release; do
            [ -e "$KPKG/$f" ] && echo "OK  $f" || echo "MISS $f"
          done

      - name: Fetch upstream kernel source (full tree required for arch headers)
        run: |
          curl -fL -o /tmp/linux.tar.xz "${{ inputs.kernel_tar }}"
          mkdir -p ksrc && tar -xf /tmp/linux.tar.xz -C ksrc --strip-components=1
          echo "KDIR=$(pwd)/ksrc" >> "$GITHUB_ENV"

      - name: Prepare kernel build tree (cross, with AOSC config)
        run: |
          set -x
          cp "$KPKG/.config" "$KDIR/.config"
          make -C "$KDIR" ARCH=loongarch CROSS_COMPILE=loongarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ olddefconfig
          make -C "$KDIR" ARCH=loongarch CROSS_COMPILE=loongarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ modules_prepare
          cp "$KPKG/Module.symvers" "$KDIR/Module.symvers"
          echo "--- kernel.release ---"; cat "$KDIR/include/config/kernel.release"
          echo "--- symvers lines ---"; wc -l "$KDIR/Module.symvers"
          echo "--- modpost arch ---"; file "$KDIR/scripts/mod/modpost"

      - name: Checkout aic8800 driver
        uses: actions/checkout@v4
        with:
          repository: radxa-pkg/aic8800
          ref: ${{ inputs.driver_ref }}
          path: aic8800

      - name: Apply driver patches
        working-directory: aic8800
        run: |
          for p in fix-sdio-firmware-path fix-sdio-per-chip-firmware-path \
                   fix-sdio-fall-through fix-vmalloc-not-include; do
            echo "== applying $p =="
            patch -p1 -i "debian/patches/$p.patch"
          done
          echo "== applying loongarch-PC-macro (local) =="
          patch -p1 -i ../patches/loongarch-PC-macro.patch

      - name: Build modules
        run: |
          make -C aic8800/src/SDIO/driver_fw/driver/aic8800 \
            KDIR="$KDIR" ARCH=loongarch CROSS_COMPILE=loongarch64-linux-gnu- \
            modules -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out/firmware
          # 只取本次编译产物，避免误收仓库自带的 ARM 预编译 .ko
          D=aic8800/src/SDIO/driver_fw/driver/aic8800
          cp -v "$D/aic8800_bsp/aic8800_bsp.ko"     out/
          cp -v "$D/aic8800_fdrv/aic8800_fdrv.ko"   out/
          cp -v "$D/aic8800_btlpm/aic8800_btlpm.ko" out/
          cp -v aic8800/src/SDIO/driver_fw/fw/aic8800D80/* out/firmware/
          echo "=== out ==="; ls -la out out/firmware; file out/*.ko

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-loongarch64
          path: out/
